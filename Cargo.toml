[package]
name = "darkroom-verify"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
blake3 = "1.8.2"
clap = { version = "4.5.54", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
thiserror = "1"
uuid = "1.18.0"

[dev-dependencies]
tempfile = "3.21.0"

[[bin]]
name = "darkroom-verify"
path = "src/main.rs"
